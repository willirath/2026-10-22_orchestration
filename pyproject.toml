[project]
name = "montepi"
version = "0.1.0"
description = "Estimate pi by Monte Carlo sampling."
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
plot = ["matplotlib"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/montepi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
